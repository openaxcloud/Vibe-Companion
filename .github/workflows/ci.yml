name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  HUSKY: "0"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Typecheck (non-blocking, baseline-tracked)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Run tsc and report error count
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          COUNT=$(grep -c "error TS" /tmp/tsc.log || true)
          echo "tsc-errors=$COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice title=TypeScript errors::$COUNT errors (baseline ~3781, see CLAUDE.md)"
        id: tsc

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: E2E (Playwright cross-surface)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      NODE_ENV: test
      OPENAI_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key
      GOOGLE_API_KEY: test-key
      SESSION_SECRET: test-session-secret-for-ci-only
      E2E_ADMIN_EMAIL: admin@test.com
      E2E_ADMIN_PASSWORD: e2e-admin-password
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Push database schema
        run: npm run db:push --if-present || npx drizzle-kit push --force || true
      - name: Seed e2e admin user (deterministic, fail-loud)
        run: npx tsx scripts/reset-e2e-admin.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run cross-surface AI chat E2E
        env:
          PLAYWRIGHT_USE_BUNDLED: "1"
        run: npx playwright test e2e/ai-chat-surfaces.spec.ts --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
